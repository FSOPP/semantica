  route: "docs/Semantica-Specs/route/route_v0.7.0_F-003.md"

open:
  - "Which backend is the default for a production deployment? Two environment keys select one and neither names a recommended value in code."
  - "What consistency is promised when the same graph is written to a graph store and a vector store? Nothing coordinates the two."
  - "Are any of the 45 backends unsupported or deprecated? The registries do not say."
